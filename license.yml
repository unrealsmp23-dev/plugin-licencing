# Optional off switch. You do NOT need to add people here - their key works by itself.
# Only use this to switch someone off. Changes reach servers within about an hour.

# false = switch the plugin off on EVERY server
enabled: true

# Shown in the console of servers that get switched off
message: "This license has been disabled."

# License names that are switched off
blocked:
  - example-name
  - goosesserver
